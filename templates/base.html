<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipe Scaler{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 0 auto; padding: 1rem; line-height: 1.4; color: #222; background: #fff; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 0.5rem 0 1rem; }
    th, td { border-bottom: 1px solid #ddd; padding: 0.35rem 0.5rem; text-align: left; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    input[type=text], input[type=number] { padding: 0.3rem; width: 100%; box-sizing: border-box; }
    .error { background: #fde8e8; border: 1px solid #e0a0a0; padding: 0.5rem 0.75rem; border-radius: 4px; }
    .alerts { background: #fff6e0; border: 1px solid #e6c36a; padding: 0.5rem 0.75rem; border-radius: 4px; }
    .ok { background: #e8f6ea; border: 1px solid #9fd0a7; padding: 0.5rem 0.75rem; border-radius: 4px; }
    button { padding: 0.35rem 0.8rem; cursor: pointer; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <nav><a href="{{ url_for('index') }}">Recipes</a><a href="{{ url_for('new_recipe') }}">New recipe</a><a href="{{ url_for('pantry_page') }}">Pantry</a></nav>
  {% block content %}{% endblock %}
</body>
</html>
